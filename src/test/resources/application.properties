# ==============================================================================
# ATELIER PLATFORM - TEST ENVIRONMENT (application.properties for tests)
# ==============================================================================
spring.application.name=atelier-platform-test

# In-Memory H2 Database with PostgreSQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:atelier_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate in test environment
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy credentials for mock / test context loading
spring.ai.openai.api-key=dummy-test-key-for-context-load
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
spring.thymeleaf.check-template-location=false
