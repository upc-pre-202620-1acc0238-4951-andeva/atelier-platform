# ==============================================================================
# ATELIER PLATFORM - PRODUCTION PROFILE (application.prod.properties)
# ==============================================================================
# Active when: spring.profiles.active=prod
# ==============================================================================

# Database & Schema Validation (Strictly prevent schema corruption)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Template Caching Enabled for maximum performance
spring.thymeleaf.cache=true

# High-Concurrency Connection Pooling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.leak-detection-threshold=60000

# Production Logging (Quiet, concise, and structured)
logging.level.root=INFO
logging.level.com.andeva.atelier=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Health & Metrics: Restrict health internals and expose only Prometheus/liveness
management.endpoint.health.show-details=never

# Swagger Documentation UI disabled in production for security hardening
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
