# ==============================================================================
# ATELIER PLATFORM - PRODUCTION PROFILE (application-prod.properties)
# ==============================================================================
# Active when: SPRING_PROFILES_ACTIVE=prod (set by the Dockerfile)
# ==============================================================================

# Security-critical secrets have NO fallback here: the app refuses to start if
# they are missing instead of running with public development defaults.
jwt.secret=${JWT_SECRET}
google.client-id=${GOOGLE_CLIENT_ID}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Schema is evolved by Hibernate (no migration tool yet)
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Template caching
spring.thymeleaf.cache=true

# Connection pool sized for the Aiven free tier
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.leak-detection-threshold=60000

# Tomcat tuned for the Render 512MB container
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:20}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN:2}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:100}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:20}

# Quiet production logging
logging.level.root=INFO
logging.level.com.andeva.atelier=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
