# ==============================================================================
# ATELIER PLATFORM - PRODUCTION PROFILE (application-prod.properties)
# ==============================================================================
# Active when: spring.profiles.active=prod
# ==============================================================================

# Database & Schema Validation (Strictly prevent schema corruption, default to validate)
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Template Caching Enabled for maximum performance
spring.thymeleaf.cache=true

# High-Concurrency Connection Pooling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.leak-detection-threshold=60000

# Production Logging (Quiet, concise, and structured)
logging.level.root=INFO
logging.level.com.andeva.atelier=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Health & Metrics: Expose UP to public health checks and full details when authorized
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}

# Swagger Documentation UI enabled to expose interactive API documentation in production
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
