# ==============================================================================
# ATELIER PLATFORM - BASE CONFIGURATION (application.properties)
# ==============================================================================
# All properties use ${ENV_VAR:default_value} syntax to support 12-factor apps,
# docker-compose, and environment variables while preserving safe dev defaults.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. APPLICATION & PROFILE SELECTION
# ------------------------------------------------------------------------------
spring.application.name=atelier-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ------------------------------------------------------------------------------
# 2. HTTP SERVER & ENCODING
# ------------------------------------------------------------------------------
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api/v1}
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

# ------------------------------------------------------------------------------
# 3. DATABASE (PostgreSQL / TimescaleDB) & CONNECTION POOL
# ------------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/atelier_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.pool-name=AtelierHikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# 4. JPA & HIBERNATE
# ------------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.hibernate.naming.physical-strategy=com.andeva.atelier.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------------------
# 5. CACHING (Caffeine)
# ------------------------------------------------------------------------------
spring.cache.type=caffeine
spring.cache.cache-names=catalogs,tenants,dtcCodes,plans,diagnostics
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60m

# ------------------------------------------------------------------------------
# 6. SECURITY, JWT, CORS & SSO
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080}
# Google Identity Services (SSO OAuth2 / OIDC)
google.client-id=${GOOGLE_CLIENT_ID:google_client_id_placeholder}

# ------------------------------------------------------------------------------
# 7. SPRING AI - PREDICTIVE VEHICLE DIAGNOSTICS & TELEMETRY
# ------------------------------------------------------------------------------
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:dummy-key}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.temperature=${SPRING_AI_OPENAI_TEMPERATURE:0.1}
spring.ai.openai.chat.max-tokens=${SPRING_AI_OPENAI_MAX_TOKENS:2500}

# ------------------------------------------------------------------------------
# 8. EXTERNAL GATEWAYS & INTEGRATIONS
# ------------------------------------------------------------------------------
# Stripe Payments & Webhooks
stripe.api-key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# Firebase Admin SDK, FCM Push Notifications & Cloud Storage
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
firebase.project-id=${FIREBASE_PROJECT_ID:atelier-platform}
app.firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:atelier-platform-cdr.appspot.com}

# Nubefact Electronic Invoicing (SUNAT Perú UBL 2.1)
nubefact.api-url=${NUBEFACT_API_URL:https://api.nubefact.com/api/v1/}
nubefact.token=${NUBEFACT_TOKEN:nubefact_token_placeholder}
app.invoicing.nubefact.base-url=${NUBEFACT_API_URL:https://api.nubefact.com/api/v1}
app.invoicing.nubefact.token=${NUBEFACT_TOKEN:nubefact_token_placeholder}

# Resend Email Gateway (Omnichannel HTTPS REST)
resend.api-key=${RESEND_API_KEY:resend_key_placeholder}
resend.from-email=${RESEND_FROM_EMAIL:notifications@atelier.andeva.com}
app.resend.api-key=${RESEND_API_KEY:resend_key_placeholder}
app.resend.from-email=${RESEND_FROM_EMAIL:notifications@atelier.andeva.com}

# ------------------------------------------------------------------------------
# 9. OBSERVABILITY (Actuator & Health Checks)
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# ------------------------------------------------------------------------------
# 10. OPENAPI & SWAGGER DOCUMENTATION
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# ------------------------------------------------------------------------------
# 11. THYMELEAF (Templates & PDF Reports)
# ------------------------------------------------------------------------------
spring.thymeleaf.check-template-location=false
