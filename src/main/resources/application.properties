# ==============================================================================
# ATELIER PLATFORM - BASE CONFIGURATION (application.properties)
# ==============================================================================
# Every external value comes from an environment variable (${ENV_VAR:default}).
# Defaults are safe for local development only; the prod profile requires the
# security-critical secrets explicitly. See .env.example for the full list.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. APPLICATION & PROFILE
# ------------------------------------------------------------------------------
spring.application.name=atelier-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Public URL of the Atelier web front (password reset, invitations, billing return)
app.frontend.base-url=${FRONTEND_BASE_URL:https://atelier.andeva.tech}

# ------------------------------------------------------------------------------
# 2. HTTP SERVER
# ------------------------------------------------------------------------------
server.port=${PORT:8080}
# Render terminates TLS at its proxy: honor X-Forwarded-* so generated URLs use https + public host
server.forward-headers-strategy=framework
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

# ------------------------------------------------------------------------------
# 3. DATABASE (PostgreSQL + TimescaleDB on Aiven) & CONNECTION POOL
# ------------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/atelier_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=AtelierHikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# 4. JPA & HIBERNATE
# ------------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.hibernate.naming.physical-strategy=com.andeva.atelier.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------------------
# 5. CACHING (Caffeine)
# ------------------------------------------------------------------------------
spring.cache.type=caffeine
spring.cache.cache-names=catalogs,tenants,dtcCodes,plans,diagnostics
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60m

# ------------------------------------------------------------------------------
# 6. SECURITY: JWT, CORS & GOOGLE SIGN-IN
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
# Browser origins only (web front); native mobile apps are not subject to CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
# Comma-separated OAuth client IDs accepted as ID token audience (Web, Android, iOS)
google.client-id=${GOOGLE_CLIENT_ID:google_client_id_placeholder}

# ------------------------------------------------------------------------------
# 7. AI DIAGNOSTICS (Spring AI over Groq's OpenAI-compatible API)
# ------------------------------------------------------------------------------
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:dummy-key}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.temperature=${SPRING_AI_OPENAI_TEMPERATURE:0.1}
spring.ai.openai.chat.max-tokens=${SPRING_AI_OPENAI_MAX_TOKENS:2500}

# ------------------------------------------------------------------------------
# 8. EXTERNAL SERVICES
# ------------------------------------------------------------------------------
# Stripe (SaaS subscriptions)
stripe.api-key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# Firebase Admin SDK (FCM push notifications only)
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
firebase.project-id=${FIREBASE_PROJECT_ID:atelier-platform}

# Supabase Storage (apps upload directly; backend only accepts URLs from this bucket)
app.storage.supabase.url=${SUPABASE_URL:https://localhost.supabase.co}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:atelier}

# Nubefact (SUNAT electronic invoicing): RUTA + TOKEN from the Nubefact account
app.invoicing.nubefact.base-url=${NUBEFACT_API_URL:https://api.nubefact.com/api/v1}
app.invoicing.nubefact.token=${NUBEFACT_TOKEN:nubefact_token_placeholder}

# Resend (transactional email from the verified andeva.tech domain)
resend.api-key=${RESEND_API_KEY:resend_key_placeholder}
resend.from-email=${RESEND_FROM_EMAIL:Atelier <notificaciones@andeva.tech>}

# Google Maps Platform (Places API - address normalization & geocoding)
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# ------------------------------------------------------------------------------
# 9. OBSERVABILITY (Actuator)
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# ------------------------------------------------------------------------------
# 10. OPENAPI & SWAGGER UI (/swagger-ui.html, /v3/api-docs)
# ------------------------------------------------------------------------------
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# ------------------------------------------------------------------------------
# 11. THYMELEAF (PDF report templates)
# ------------------------------------------------------------------------------
spring.thymeleaf.check-template-location=false

# ------------------------------------------------------------------------------
# 12. DEMO WORKSHOP (class presentations; disabled by default)
# Names (DEMO_ADMIN_FIRST_NAME, DEMO_ADMIN_LAST_NAME, DEMO_MECHANIC_FIRST_NAME, DEMO_MECHANIC_LAST_NAME,
# DEMO_WORKSHOP_NAME, DEMO_WORKSHOP_LEGAL_NAME) are read straight from the environment by DemoSeedProperties.
# ------------------------------------------------------------------------------
app.demo.enabled=${DEMO_SEED_ENABLED:false}
app.demo.admin.email=${DEMO_ADMIN_EMAIL:}
app.demo.admin.password=${DEMO_ADMIN_PASSWORD:}
app.demo.mechanic.email=${DEMO_MECHANIC_EMAIL:}
app.demo.mechanic.password=${DEMO_MECHANIC_PASSWORD:}
app.demo.workshop.ruc=${DEMO_WORKSHOP_RUC:20612345679}
app.demo.branch.latitude=${DEMO_BRANCH_LAT:-12.0464}
app.demo.branch.longitude=${DEMO_BRANCH_LNG:-77.0428}
app.demo.branch.radius-meters=${DEMO_BRANCH_RADIUS:300}
