# ==============================================================================
# ATELIER PLATFORM - DEVELOPMENT PROFILE (application-dev.properties)
# ==============================================================================
# Active when: spring.profiles.active=dev
# ==============================================================================

# Database & Schema Auto-Update for local iteration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Detailed Debug Logging for local development
logging.level.com.andeva.atelier=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Hot Reload & Template Caching
spring.thymeleaf.cache=false

# Full Actuator details for debugging
management.endpoint.health.show-details=always

# Swagger / OpenAPI UI fully accessible in development
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
